services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: catalog-manager
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d catalog-manager"]
      interval: 2s
      timeout: 5s
      retries: 10

  placement-manager:
    image: wiremock/wiremock:3x
    ports:
      - "28081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/mappings"]
      interval: 2s
      timeout: 5s
      retries: 10

  catalog-manager:
    build:
      context: ../..
      dockerfile: Containerfile
    environment:
      BIND_ADDRESS: "0.0.0.0:8080"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: catalog-manager
      DB_USER: admin
      DB_PASSWORD: adminpass
      PLACEMENT_MANAGER_URL: "http://placement-manager:8080"
    ports:
      - "28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      placement-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 2s
      timeout: 5s
      retries: 15
